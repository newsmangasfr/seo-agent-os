version: "3.8"

services:
  agent-os:
    build: .
    container_name: agent-os
    restart: unless-stopped
    # Port publié UNIQUEMENT sur localhost — xCloud proxifie via nginx.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Données persistantes (SQLite + clés API) — volume nommé Docker.
      - agentos-data:/data
    environment:
      - PORT=8000
      - AGENTOS_DATA_DIR=/data
      - DASH_PASSWORD=${DASH_PASSWORD:-}

volumes:
  agentos-data:
