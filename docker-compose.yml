version: "3.8"

services:
  agent-os:
    build: .
    container_name: agent-os
    restart: unless-stopped
    # Port publié UNIQUEMENT sur localhost — xCloud proxifie via nginx.
    # (ne jamais binder 0.0.0.0 : contournerait le firewall du serveur)
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000
      - DASH_PASSWORD=${DASH_PASSWORD:-}
